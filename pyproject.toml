[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neyra"
version = "0.1.4"
description = "Neyra: local desktop dictation assistant using PySide6, Whistle, or Voz"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.6",
    "cactus-needle[mic]",
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "pynput>=1.7",
    "pyperclip>=1.8",
    "soundcard>=0.4.6",
    "PyJWT[crypto]>=2.10,<3",
    "piper-tts>=1.8,<2",
    "onnxruntime-webgpu>=1.27,<2; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "onnxruntime>=1.23,<2; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine != 'x86_64') or (sys_platform == 'win32' and platform_machine != 'AMD64')",
    "huggingface-hub>=1,<3",
    "onnx>=1.17,<2",
]

[project.scripts]
neyra = "neyra.main:main"

[tool.setuptools.packages.find]
include = ["neyra*"]

[project.optional-dependencies]
build = ["nuitka>=2.6", "ordered-set>=4.1", "zstandard>=0.23"]
companion = [
    "cryptography>=44",
    "zeroconf>=0.148,<1",
]

[tool.uv]
package = true

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[dependency-groups]
dev = [
    "ruff>=0.14,<1",
]
