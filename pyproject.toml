[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neyra"
version = "0.1.2"
description = "Neyra: local desktop dictation assistant using PySide6, Whistle, or Voz"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.6",
    "cactus-needle[mic]",
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "pynput>=1.7",
    "pyperclip>=1.8",
    "soundcard>=0.4.6",
    "PyJWT[crypto]>=2.10,<3",
]

[project.scripts]
neyra = "neyra.main:main"

[tool.setuptools.packages.find]
include = ["neyra*"]

[tool.setuptools.package-data]
neyra = ["*.mjs"]

[project.optional-dependencies]
build = ["nuitka>=2.6", "ordered-set>=4.1", "zstandard>=0.23"]

[tool.uv]
package = true

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[dependency-groups]
dev = [
    "ruff>=0.14,<1",
]
