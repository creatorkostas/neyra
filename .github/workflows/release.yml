name: Build and release

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "website/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "website/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Neyra-Windows
            mode: --onefile
          - os: ubuntu-22.04
            artifact: Neyra-Linux-x86_64
            mode: --onefile
          - os: macos-14
            artifact: Neyra-macOS-AppleSilicon
            mode: --standalone
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential patchelf
      - name: Install project and build dependencies
        run: uv sync --locked --extra build --no-dev
      - name: Install Voz runtime dependencies
        run: npm ci --omit=dev
      - name: Check installed Piper runtime
        run: uv run --no-dev --locked python scripts/check_piper.py
      - name: Check installed Voz runtime
        run: node scripts/check_voz.mjs
      - name: Build executable
        run: uv run --no-dev --locked --extra build python scripts/build.py ${{ matrix.mode }}
      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: tar -czf dist/Neyra-Linux-x86_64.tar.gz -C dist Neyra
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Neyra.app dist/Neyra-macOS-AppleSilicon.zip
      - name: Check Windows executable
        if: runner.os == 'Windows'
        run: uv run --no-dev --locked python scripts/check_release.py windows dist/Neyra.exe
      - name: Check Linux archive
        if: runner.os == 'Linux'
        run: uv run --no-dev --locked python scripts/check_release.py linux dist/Neyra-Linux-x86_64.tar.gz
      - name: Check macOS app archive
        if: runner.os == 'macOS'
        run: uv run --no-dev --locked python scripts/check_release.py macos dist/Neyra-macOS-AppleSilicon.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'Windows' && 'dist/Neyra.exe' || (runner.os == 'macOS' && 'dist/Neyra-macOS-AppleSilicon.zip' || 'dist/Neyra-Linux-x86_64.tar.gz') }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: Neyra-*
          merge-multiple: true
      - name: Prepare AUR submission files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python scripts/prepare_aur.py
          --version "$RELEASE_TAG"
          --archive release-assets/Neyra-Linux-x86_64.tar.gz
          --output aur-output
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*
            aur-output/neyra-bin-*-aur.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
