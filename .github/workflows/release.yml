name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Neyra-Windows
          - os: ubuntu-22.04
            artifact: Neyra-Linux-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential patchelf
      - name: Install project and build dependencies
        run: uv sync --extra build
      - name: Build executable
        run: uv run python scripts/build.py --onefile
      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: tar -czf dist/Neyra-Linux-x86_64.tar.gz -C dist Neyra
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'Windows' && 'dist/Neyra.exe' || 'dist/Neyra-Linux-x86_64.tar.gz' }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: Neyra-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
