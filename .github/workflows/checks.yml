name: Checks

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "website/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libpulse0 pulseaudio xvfb xauth libegl1 libopengl0
          pulseaudio --start --exit-idle-time=-1
      - name: Install locked Python dependencies
        run: uv sync --locked --group dev
      - name: Check Python
        run: uv run --locked ruff check neyra scripts tests packaging/aur/check_generator.py
      - name: Check installed Piper runtime
        run: uv run --locked python scripts/check_piper.py
      - name: Check installed Voz runtime
        run: uv run --locked python scripts/check_voz.py
      - name: Run regression tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --locked python -m unittest discover -s tests -v
      - name: Run regression tests on Windows
        if: runner.os == 'Windows'
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Check AUR generator
        run: uv run --locked python packaging/aur/check_generator.py
